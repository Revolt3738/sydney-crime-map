name: Update BOCSAR suburb data

on:
  schedule:
    - cron: "17 2 15 * *"
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.1"
      - name: Verify the update and site builds
        run: python work/check_site.py
  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: crime-data-update
      cancel-in-progress: false
    steps:
      - name: Require the production branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run this workflow on the main branch." >&2
            exit 1
          fi
      - name: Check out the project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.1"
      - name: Download and update BOCSAR data
        run: python work/update_crime_data.py
      - name: Validate data and build the site
        run: python work/check_site.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- work/crime_data.json work/crime_period.json; then
            echo "The official data has not changed."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- work/crime_data.json work/crime_period.json outputs/sydney-crime-seo
          git commit -m "Update BOCSAR suburb data"
          git push origin HEAD:main
